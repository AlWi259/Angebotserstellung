    Ein verbindlicher Vertragsabschluss kommt in jedem Fall erst mit der schriftlichen oder elektronischen Annahmeerklärung des unterzeichneten Angebots durch den Auftragnehmer zustande.

    Sollte eine Bestimmung des auf Basis dieses Angebots geschlossenen Vertrages unwirksam oder undurchführbar sein oder werden, bleibt der Vertrag im Übrigen wirksam. Die Parteien verpflichten sich, in einem solchen Fall eine Regelung zu vereinbaren, die dem wirtschaftlichen Zweck der unwirksamen Bestimmung möglichst nahekommt.

    Mit seiner Unterschrift erklärt der Auftraggeber die Annahme der im Angebot aufgeführten Arbeitspakete sowie die Geltung der Allgemeinen Geschäftsbedingungen (AGB) der accantec information solutions GmbH in der Fassung vom {agb_date}.

    Die vollständigen AGB können Sie hier einsehen: https://www.accantec.de/images/dokumente_pdf/251009_agb_accantec_information_solutions_gmbh.pdf
