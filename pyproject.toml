[project]
name = "angebotserstellung"
version = "0.1.0"
description = "Internes Angebotserstellungstool der accantec information solutions GmbH — Markdown-first, PDF-Ausgabe."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [
  { name = "accantec information solutions GmbH", email = "info@accantec.de" },
]
keywords = ["consulting", "offer", "pdf", "markdown", "angebot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "markdown>=3.5.0",
  "weasyprint>=62.0",
  "openpyxl>=3.1.0",
  "filelock>=3.13.0",
  "pyyaml>=6.0.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.8",
]

[project.scripts]
angebot = "backend.cli:main"

# TODO: Update URLs when the internal repo is set up
# [project.urls]
# Repository = "https://github.com/accantec/angebotserstellung"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
